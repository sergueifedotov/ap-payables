# Dev SPIRE agent. Not a production configuration.
agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/opt/spire/sockets/agent/api.sock"
    trust_bundle_path = "/opt/spire/bootstrap/bundle.pem"
    trust_domain = "ap.example"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
