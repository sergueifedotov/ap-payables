# Accounts payable. Dev only. Not for production.
# Start with scripts/bootstrap.sh. Vault is published on host port 8201 so it
# can run beside another dev Vault on 8200.
#
# The gateway container joins the SPIRE agent's PID namespace so the Unix
# workload attestor can see who called the Workload API.

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.3
    user: "0:0"
    command: ["-config", "/opt/spire/conf/server.conf"]
    volumes:
      - ./conf/server.conf:/opt/spire/conf/server.conf:ro
      - server-data:/opt/spire/data/server
      - server-sock:/opt/spire/sockets/server
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/opt/spire/sockets/server/api.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3
    command: ["-config", "/opt/spire/conf/agent.conf", "-joinToken", "${JOIN_TOKEN:-run-scripts-bootstrap.sh}"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./conf/agent.conf:/opt/spire/conf/agent.conf:ro
      - ./.state/bootstrap:/opt/spire/bootstrap:ro
      - agent-data:/opt/spire/data/agent
      - agent-sock:/opt/spire/sockets/agent
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/sockets/agent/api.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: payables
      POSTGRES_PASSWORD: payables-lab
      POSTGRES_DB: payables
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payables -d payables"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:1.17.6
    ports:
      - "8201:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build: .
    user: "1003:1003"
    pid: "service:spire-agent"
    command: ["python3", "-u", "/opt/app/gateway/app.py"]
    environment:
      PYTHONPATH: /opt/app
      SPIRE_SOCKET: /opt/spire/sockets/agent/api.sock
      VAULT_ADDR: http://vault:8200
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: payables
      IDP_JWT_SECRET: ap-idp-hmac-key-not-for-production-use
      OBO_JWT_SECRET: ap-obo-hmac-key-not-for-production-use
      AUDIT_PATH: /opt/app/state/audit.jsonl
      ROLE_PATH: /opt/app/state/last_role.txt
      JWKS_PATH: /opt/app/state/jwks.json
      CORPUS_PATH: /opt/app/corpus/ap
      TRUST_DOMAIN: ap.example
      GATEWAY_AUDIENCE: pay-gateway
      RESOURCE_AUDIENCE: ap-payables
      VAULT_AUDIENCE: vault.ap.example
      GATEWAY_SPIFFE_ID: spiffe://ap.example/workload/pay-gateway
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_CHAT_MODEL: qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gateway:/opt/app/gateway:ro
      - ./corpus:/opt/app/corpus:ro
      - ./.state:/opt/app/state
      - agent-sock:/opt/spire/sockets/agent
    depends_on:
      spire-agent:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  server-data:
  server-sock:
  agent-data:
  agent-sock:
